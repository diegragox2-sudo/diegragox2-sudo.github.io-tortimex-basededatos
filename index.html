<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TortiMex · Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{--bg:#000;--card:#111814;--green:#10b981;--red:#e63946;--txt:#fff;--mut:#9aa8a0;--line:#26332b}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;font-size:112.5%}
body{background:var(--bg);color:var(--txt);font-family:Figtree,system-ui,sans-serif;font-weight:500;min-height:100vh;padding-bottom:90px}
.franja{height:8px;background:linear-gradient(90deg,var(--green) 0 33.3%,#fff 33.3% 66.6%,var(--red) 66.6%)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px;max-width:960px;margin:0 auto}
.marca{font-family:'Lilita One',cursive;font-size:1.9rem;letter-spacing:.02em;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 var(--red)}
.marca small{display:block;font-family:Figtree;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--green);text-shadow:none;-webkit-text-stroke:0;font-weight:800}
.fecha{font-size:.8rem;color:var(--mut);text-align:right}
main{max-width:960px;margin:0 auto;padding:10px 16px}
nav{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:3px solid #fff;display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:960px}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 9px;font:800 .54rem Figtree;letter-spacing:.01em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;fill:currentColor}
nav button.on{color:var(--green)}
h2{font-family:'Lilita One';font-weight:400;font-size:1.5rem;letter-spacing:.02em;margin:10px 0 10px}
h3{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:18px 0 8px}
.panel{background:var(--card);border:3px solid #fff;border-radius:14px;box-shadow:5px 5px 0 var(--green);padding:14px;margin-bottom:16px}
.panel.r{box-shadow:5px 5px 0 var(--red)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.kpi{background:var(--card);border:3px solid #fff;border-radius:14px;box-shadow:4px 4px 0 var(--green);padding:12px}
.kpi.r{box-shadow:4px 4px 0 var(--red)}
.kpi b{display:block;font-family:'Lilita One';font-weight:400;font-size:1.7rem;line-height:1.1}
.kpi span{font-size:.72rem;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.fila{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fila:last-child{border-bottom:0}
.fila .n{flex:1;min-width:0}
.fila .n b{display:block;font-weight:800;font-size:.95rem}
.fila .n small{color:var(--mut);font-size:.78rem}
.stock{font-weight:800;font-size:.85rem;padding:3px 9px;border-radius:99px;border:2px solid var(--green);color:var(--green);white-space:nowrap}
.stock.bajo{border-color:var(--red);color:var(--red)}
.stock.cero{background:var(--red);border-color:var(--red);color:#fff}
.cant{display:flex;align-items:center;gap:6px}
.cant button{width:38px;height:38px;border-radius:10px;border:2px solid #fff;background:#000;color:#fff;font:800 1.3rem Figtree;cursor:pointer;line-height:1}
.cant button.mas{background:var(--green);border-color:var(--green);color:#000}
.cant output{min-width:26px;text-align:center;font-weight:800;font-size:1.05rem}
.btn{display:block;width:100%;background:var(--green);color:#000;border:3px solid #fff;border-radius:12px;box-shadow:4px 4px 0 #fff;padding:13px;font:800 1rem Figtree;letter-spacing:.04em;cursor:pointer;text-transform:uppercase}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #fff}
.btn.r{background:var(--red);color:#fff}
.btn.g{background:#000;color:#fff;box-shadow:none;font-size:.85rem;padding:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
label{display:block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:800;margin:10px 0 5px}
input,select{width:100%;background:#000;color:#fff;border:2px solid #fff;border-radius:10px;padding:11px;font:600 1rem Figtree}
input:focus,select:focus{outline:3px solid var(--green)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 2px;border-radius:10px;border:2px solid #fff;background:#000;color:#fff;font:800 .72rem Figtree;cursor:pointer;text-transform:uppercase}
.seg button.on{background:var(--green);border-color:var(--green);color:#000}
.seg button.on.py{background:var(--red);border-color:var(--red);color:#fff}
.seg button.on.s{background:var(--red);border-color:var(--red);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips button{flex:none;padding:7px 13px;border-radius:99px;border:2px solid #fff;background:#000;color:#fff;font:800 .8rem Figtree;cursor:pointer}
.chips button.on{background:var(--green);border-color:var(--green);color:#000}
.tag{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.tag.venta{background:var(--green);color:#000}.tag.entrada{background:#fff;color:#000}.tag.salida{background:var(--red);color:#fff}
.tag.cl{background:#a78bfa;color:#000}.tag.py{background:var(--red);color:#fff}.tag.tr{background:#fff;color:#000}.tag.cr{background:#f4a261;color:#000}
.del{background:none;border:0;color:var(--mut);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.total{position:sticky;bottom:78px;background:#000;border:3px solid #fff;border-radius:14px;box-shadow:5px 5px 0 var(--red);padding:12px;margin-top:14px;display:flex;align-items:center;gap:12px}
.total div{flex:1}.total b{font-family:'Lilita One';font-weight:400;font-size:1.6rem;display:block;line-height:1}
.total span{font-size:.72rem;color:var(--mut);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.total .btn{width:auto;padding:12px 18px}
.vacio{color:var(--mut);text-align:center;padding:18px 6px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#000;border:3px solid #fff;border-radius:12px;padding:10px 18px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit{display:grid;grid-template-columns:1fr 70px 70px 36px;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.edit input{padding:8px 4px;font-size:.88rem;text-align:center}
.edit .n{font-weight:800;font-size:.85rem}
.cab{font-size:.64rem;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.nota{font-size:.78rem;color:var(--mut);margin-top:8px;line-height:1.4}
.lin{display:grid;grid-template-columns:22px 1fr 96px;gap:8px;align-items:center;margin-bottom:8px}
.lin i{font-style:normal;color:var(--mut);font-weight:800;font-size:.85rem;text-align:center}
.lin input{padding:9px;font-size:.92rem}
.resu{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-weight:700}
.resu:last-child{border-bottom:0}
.resu.t{font-family:'Lilita One';font-weight:400;font-size:1.25rem;border-top:2px solid #fff;margin-top:4px;padding-top:10px}
.pago{background:var(--card);border:3px solid #fff;border-radius:14px;box-shadow:5px 5px 0 var(--green);padding:12px;margin-top:14px}
.pago .top{display:flex;gap:10px;align-items:center}
.pago .top input{flex:1;font-size:1.2rem;font-weight:800;padding:10px}
.pago .top span{font-size:.72rem;color:var(--mut);font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.bill{display:flex;gap:6px;margin-top:10px}
.bill button{flex:1;padding:9px 2px;border-radius:10px;border:2px solid #fff;background:#000;color:#fff;font:800 .85rem Figtree;cursor:pointer}
.bill button.on{background:var(--green);border-color:var(--green);color:#000}
.vuelto{text-align:center;font-family:'Lilita One';font-size:1.7rem;margin-top:12px;padding:10px;border-radius:12px;border:3px solid #fff;background:#000}
.vuelto small{display:block;font-family:Figtree;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:800}
.vuelto.ok{background:var(--green);color:#000}.vuelto.ok small{color:#000}
.vuelto.mal{background:var(--red);color:#fff}.vuelto.mal small{color:#fff}
.dif{text-align:center;font-family:'Lilita One';font-size:1.35rem;padding:10px;border-radius:12px;border:3px solid #fff;margin-top:10px}
.dif.cero{background:#000;color:#fff}.dif.ok{background:var(--green);color:#000}.dif.mal{background:var(--red);color:#fff}
.alerta{background:var(--red);color:#fff;border:3px solid #fff;border-radius:14px;padding:12px 14px;margin:8px 0 16px;box-shadow:5px 5px 0 #fff}
.alerta b{display:block;font-family:'Lilita One';font-weight:400;font-size:1.3rem;letter-spacing:.04em;margin-bottom:2px}
.alerta span{font-weight:700;line-height:1.35;display:block}
.alerta.ok{background:var(--green);color:#000;box-shadow:5px 5px 0 var(--red)}
.stock.ok{background:var(--green);border-color:var(--green);color:#000}
.scat{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:800;padding:12px 0 2px;border-bottom:2px solid var(--line)}
.scat:first-child{padding-top:0}
.sgrid .fila{padding:8px 0}
.edit .x{background:none;border:2px solid var(--red);color:var(--red);border-radius:8px;height:34px;font:800 1rem Figtree;cursor:pointer}
.edit input.nm{text-align:left;padding:8px;font-weight:700}
#canal{display:grid;grid-template-columns:1fr 1fr;gap:8px}#canal button{padding:14px 4px;font-size:.8rem}
#prev{width:100%;border:3px solid #fff;border-radius:10px;background:#fff;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.modal.hide{display:none}
.hoja{width:100%;max-width:640px;background:var(--card);border:3px solid #fff;border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -5px 0 var(--green);padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.hoja h2{margin:0 0 4px}
.hoja .tt{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding:6px 0 12px;margin-bottom:6px}
.hoja .tt span{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:800}
.hoja .tt b{font-family:'Lilita One';font-weight:400;font-size:2.2rem;line-height:1}
.bill{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.bill button{padding:13px 4px;border-radius:10px;border:2px solid #fff;background:#000;color:#fff;font:800 1.05rem Figtree;cursor:pointer}
.bill button.ex{background:var(--green);border-color:var(--green);color:#000}
.bill button:active{transform:scale(.97)}
.vuelto{text-align:center;font-family:'Lilita One';font-size:2rem;padding:12px;border-radius:14px;border:3px solid #fff;margin:12px 0;line-height:1.1}
.vuelto small{display:block;font-family:Figtree;font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:2px}
.vuelto.ok{background:var(--green);color:#000}.vuelto.mal{background:var(--red);color:#fff}.vuelto.nada{background:#000;color:var(--mut);font-size:1.1rem}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="franja"></div>
<header>
  <div class="marca">TortiMex<small>Inventario</small></div>
  <div class="fecha"><div id="hoy"></div><div id="est" style="margin-top:3px;font-weight:700"></div></div>
</header>
<main id="vista"></main>
<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast" role="status"></div>
<div class="modal hide" id="cobro" role="dialog" aria-modal="true" aria-label="Cobro">
  <div class="hoja">
    <h2>Cobrar</h2>
    <div class="tt"><span>Total a cobrar</span><b id="cb-total">Q0</b></div>
    <label for="cb-paga" style="margin-top:6px">Paga con</label>
    <input id="cb-paga" inputmode="decimal" placeholder="Q" autocomplete="off">
    <div class="bill" id="cb-bill"></div>
    <div class="vuelto nada" id="cb-vuelto">Escribe con cuánto paga</div>
    <div class="grid2"><button class="btn g" id="cb-no" style="border:3px solid #fff">Cancelar</button><button class="btn" id="cb-ok">Confirmar</button></div>
  </div>
</div>

const rpc=async(fn,body)=>{
  const r=await fetch(SUPA_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:Object.assign({'apikey':SUPA_KEY,'Content-Type':'application/json'},SUPA_KEY.startsWith('sb_')?{}:{'Authorization':'Bearer '+SUPA_KEY}),body:JSON.stringify(body)});
  if(!r.ok)throw 'http '+r.status;
  return r.json();
};

let S=cargar(),COLA=cargarCola(),estadoRed=API_URL?'off':'local';
function cargar(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.productos){d.cortes=d.cortes||{};return d}}catch(e){}
  return {productos:SEED.map((p,i)=>({id:'p'+(i+1),nombre:p[0],cat:p[1],precio:p[2],pp:p[3],min:0})).concat(CLIENTES.map((p,i)=>({id:'c'+(i+1),nombre:p[0],cat:p[1],precio:p[2],pp:p[3],min:0}))),mov:[],cortes:{}};
}
function cargarCola(){try{return JSON.parse(localStorage.getItem(KQ))||[]}catch(e){return []}}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KQ,JSON.stringify(COLA))}catch(e){aviso('No se pudo guardar en este navegador',1)}}
const nid=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const copia=x=>JSON.parse(JSON.stringify(x));

/* ---------- Sincronización ---------- */
function aplicar(st,o){
  if(o.op==='addMov'){if(!st.mov.some(m=>m.id===o.mov.id))st.mov.push(o.mov)}
  else if(o.op==='delMov'){st.mov=st.mov.filter(m=>m.id!==o.id)}
  else if(o.op==='setProductos'){st.productos=copia(o.productos)}
  else if(o.op==='setCorte'){st.cortes=st.cortes||{};st.cortes[o.fecha]=copia(o.datos)}
}
function op(o){aplicar(S,o);COLA.push(copia(o));guardar();sync()}
let sincronizando=false;
async function sync(){
  if(!API_URL||sincronizando)return;
  sincronizando=true;
  try{
    let pin=localStorage.getItem(KP);
    if(!pin){pin=(prompt('Código de acceso del inventario:')||'').trim();if(!pin)throw 'pin';localStorage.setItem(KP,pin)}
    if(COLA.length){
      const n=COLA.length;
      const r=await rpc('inv_ops',{p_pin:pin,p_ops:COLA.slice(0,n)});
      if(r.error){if(r.error==='pin')localStorage.removeItem(KP);throw r.error}
      COLA.splice(0,n);guardar();
    }
    const d=await rpc('inv_all',{p_pin:pin});
    if(d.error){if(d.error==='pin')localStorage.removeItem(KP);throw d.error}
    if(!d.productos.length){
      await rpc('inv_ops',{p_pin:pin,p_ops:[{op:'setProductos',productos:S.productos}]});
    }else{
      const antes=JSON.stringify(S),nuevo={productos:d.productos,mov:d.mov,cortes:d.cortes||{}};
      COLA.forEach(o=>aplicar(nuevo,o));
      S=nuevo;
      if(!S.productos.some(p=>p.cat==='Clientes')){ // catálogo viejo: agregar la sección Clientes
        S.productos=S.productos.concat(CLIENTES.map((p,i)=>({id:'c'+(i+1),nombre:p[0],cat:p[1],precio:p[2],pp:p[3],min:0})));
        COLA.push({op:'setProductos',productos:copia(S.productos)});setTimeout(sync,300);
      }
      guardar();
      if(antes!==JSON.stringify(S))refrescar();
    }
    estadoRed='ok';
  }catch(e){estadoRed='off'}
  finally{sincronizando=false;pintarEstado()}
}
function refrescar(){const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;keep(()=>render())}
function pintarEstado(){
  const e=document.getElementById('est');if(!e)return;
  const n=COLA.length;
  e.innerHTML=estadoRed==='ok'&&!n?'<i style="color:var(--green)">●</i> Sincronizado':estadoRed==='local'?'<i style="color:var(--mut)">●</i> Solo en este aparato':'<i style="color:var(--red)">●</i> Sin conexión'+(n?` · ${n} pendiente${n>1?'s':''}`:'');
}

/* ---------- Utilidades ---------- */
const pad=n=>String(n).padStart(2,'0');
const dia=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hora=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dmy=f=>f.split('-').reverse().join('/');
const Q=n=>'Q'+(+n).toLocaleString('es-GT',{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2});
const Q2=n=>'Q'+(+n||0).toFixed(2);
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?0:x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prod=id=>S.productos.find(p=>p.id===id);
const stockDe=id=>S.mov.reduce((a,m)=>m.pid!==id?a:a+(m.tipo==='entrada'?m.cant:-m.cant),0);
const esCliente=p=>!!p&&p.cat==='Clientes';
const estado=p=>esCliente(p)?'':(stockDe(p.id)<=0?'cero':'');
const precioDe=(p,canal)=>!esCliente(p)&&canal==='pedidosya'&&p.pp!=null&&p.pp!==''?+p.pp:+p.precio;
const canalDe=m=>m.canal||'tienda';
function aviso(t,err){const e=document.getElementById('toast');e.textContent=t;e.className='toast on'+(err?' err':'');clearTimeout(aviso.t);aviso.t=setTimeout(()=>e.className='toast',2200)}
function keep(f){const y=scrollY;f();scrollTo(0,y)}

/* ---------- Cálculo del día (corte de caja) ---------- */
function cierre(f){
  const ms=S.mov.filter(m=>dia(new Date(m.ts))===f);
  const ventas=ms.filter(m=>m.tipo==='venta');
  const tienda={};
  ventas.filter(m=>canalDe(m)==='tienda').forEach(m=>{const x=tienda[m.pid]=tienda[m.pid]||{c:0,t:0};x.c+=m.cant;x.t+=m.cant*m.precio});
  const tickets=c=>{const g={};ventas.filter(m=>canalDe(m)===c).forEach(m=>{const k=m.ticket||m.id;const x=g[k]=g[k]||{ts:m.ts,nota:m.nota||'',m:0,it:[]};x.m+=m.cant*m.precio;x.it.push((prod(m.pid)?prod(m.pid).nombre:'?')+' ×'+m.cant)});
    return Object.values(g).sort((a,b)=>a.ts-b.ts).map(x=>({l:c==='credito'?((x.nota?x.nota+' · ':'')+x.it.join(', ')):(x.nota||((c==='tarjeta'?'Venta ':'Pedido ')+hora(x.ts))),m:x.m}))};
  const entr={};ms.filter(m=>m.tipo==='entrada').forEach(m=>{entr[m.pid]=(entr[m.pid]||0)+m.cant});
  const produccion=Object.entries(entr).map(([id,c])=>(prod(id)?prod(id).nombre:'(borrado)')+' · '+c);
  const desperdicio=ms.filter(m=>m.tipo==='salida').reduce((a,m)=>a+m.cant,0);
  const datos=S.cortes[f]||{};
  const sum=a=>a.reduce((s,x)=>s+(+x.m||0),0);
  const gastos=(datos.gastos||[]).filter(g=>g.c||g.m);
  const tot1=Object.values(tienda).reduce((a,x)=>a+x.t,0);
  const py=tickets('pedidosya'),tr=tickets('transferencia'),tj=tickets('tarjeta'),cr=tickets('credito');
  const tg=sum(gastos),tpy=sum(py),ttr=sum(tr),ttj=sum(tj),tcr=sum(cr);
  const ef=num(datos.ef);
  return {f,datos,tienda,produccion,desperdicio,gastos,py,tr,tj,cr,tot1,tg,tpy,ttr,ttj,tcr,
    ventaTotal:tot1+tg+tpy+ttr+ttj+tcr, efGastos:ef+tg, esperado:tot1+tcr, dif:Math.round((ef+tg-(tot1+tcr))*100)/100, ef};
}

function bVender(){
  const v=document.getElementById('vista');
  document.getElementById('canal').onclick=e=>{const b=e.target.closest('button');if(b){canalV=b.dataset.k;keep(()=>render())}};

function registrar(vuelto){
  const faltan=Object.entries(carro).filter(([id,c])=>!esCliente(prod(id))&&c>stockDe(id)).map(([id])=>prod(id).nombre);
  if(faltan.length&&!confirm('No hay stock suficiente de:\n• '+faltan.join('\n• ')+'\n\n¿Registrar la venta de todos modos?'))return;
  const ts=Date.now(),tk=nid(),nota=notaV.trim(),t=totalCarro();

function pintarCobro(){
  const v=document.getElementById('cb-vuelto'),ok=document.getElementById('cb-ok');

  else{v.className='vuelto ok';v.innerHTML='<small>Dar de vuelto</small>'+Q2(dif);ok.disabled=false}
}

document.getElementById('cb-ok').onclick=()=>{

function guardarCierre(){
  const d=leerCierre();
  try{localStorage.setItem(KR,d.resp)}catch(e){}
  op({op:'setCorte',fecha:fechaC,datos:d});
}
function bCierre(){
  document.getElementById('fc').onchange=e=>{fechaC=e.target.value||dia();render()};
  document.querySelectorAll('#vista input:not(#fc)').forEach(i=>i.addEventListener('input',()=>{pintarCierre();clearTimeout(tG);tG=setTimeout(guardarCierre,700)}));
  document.getElementById('addg').onclick=()=>{
    const d=leerCierre();d.gastos.push({c:'',m:null});
    S.cortes[fechaC]=d;render();
  };
  const pr=document.getElementById('prev');
  const generar=async()=>{
    guardarCierre();
    const cv=await dibujarCorte(fechaC);
    pr.src=cv.toDataURL('image/png');pr.classList.remove('hide');
    return cv;
  };
  const archivo=cv=>new Promise(r=>cv.toBlob(b=>r(new File([b],'corte-de-caja-'+fechaC+'.png',{type:'image/png'})),'image/png'));
  document.getElementById('img-c').onclick=async()=>{
    const cv=await generar(),f=await archivo(cv);
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Corte de caja '+dmy(fechaC)})}catch(e){}}
    else{descargar(f);aviso('Imagen descargada')}
  };
  document.getElementById('img-d').onclick=async()=>{const cv=await generar();descargar(await archivo(cv));aviso('Imagen descargada')};
  pintarCierre();
  pr.scrollIntoView&&0;
}
function descargar(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ---------- Imagen del corte (formato de la hoja) ---------- */
async function dibujarCorte(f){
  const c0=cierre(f),d=datosC(f);
  try{await Promise.all([document.fonts.load('800 14px Figtree'),document.fonts.load('500 14px Figtree')])}catch(e){}
  const logo=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=LOGO});
  const W=1500,SC=2,BH=3000,H=24,GR='#d9d9d9';
  const big=document.createElement('canvas');big.width=W*SC;big.height=BH*SC;
  const c=big.getContext('2d');c.scale(SC,SC);c.fillStyle='#fff';c.fillRect(0,0,W,BH);
  const cell=(x,y,w,h,t,o={})=>{
    if(o.fill){c.fillStyle=o.fill;c.fillRect(x,y,w,h)}
    c.strokeStyle='#000';c.lineWidth=o.lw||1.5;c.strokeRect(x,y,w,h);
    if(t!==''&&t!=null){c.fillStyle=o.color||'#000';c.font=`${o.bold?800:500} ${o.size||14}px Figtree,Arial,sans-serif`;c.textBaseline='middle';
      c.textAlign=o.align||'left';const px=o.align==='center'?x+w/2:o.align==='right'?x+w-7:x+7;c.fillText(String(t),px,y+h/2+1,w-12)}
  };
  const m$=v=>v?Q2(v):'';
  /* izquierda */
  const LX=20;let yl=130;
  if(logo)c.drawImage(logo,LX,8,150,Math.round(150*logo.height/logo.width));
  c.fillStyle='#000';c.font='800 30px Figtree,Arial';c.textAlign='left';c.textBaseline='middle';c.fillText('CORTE DE CAJA',230,60);
  cell(LX,yl,730,H,'PRODUCCIÓN',{bold:1,align:'center'});yl+=H;
  const pn=Math.max(6,c0.produccion.length),pr=Math.ceil(pn/2);
  for(let r=0;r<pr;r++){
    cell(LX,yl,40,H,r+1,{align:'center'});cell(LX+40,yl,315,H,c0.produccion[r]||'',{size:13});
    cell(LX+355,yl,40,H,pr+r+1,{align:'center'});cell(LX+395,yl,335,H,c0.produccion[pr+r]||'',{size:13});yl+=H;
  }
  yl+=22;
  const cols=[[60,'CÓDIGO'],[330,'PRODUCTO'],[100,'PRECIO TIENDA'],[100,'CANT. TIENDA'],[140,'TOTAL TIENDA']];
  let x=LX;cols.forEach(([w,t])=>{cell(x,yl,w,34,t,{bold:1,align:'center',size:12});x+=w});yl+=34;
  const rowL=(vals,o={})=>{let x=LX;cols.forEach(([w],i)=>{cell(x,yl,w,H,vals[i]==null?'':vals[i],Object.assign({align:i===1?'left':(i===0?'center':'right'),fill:o.fill,bold:o.bold},o.col&&o.col[i]||{}));x+=w});yl+=H};
  TCATS.forEach((cat,ci)=>{
    const ps=S.productos.filter(p=>p.cat===cat);if(!ps.length)return;
    rowL([ci+1,cat],{bold:1,col:{1:{align:'left',bold:1}}});
    let sc=0,st=0;
    ps.forEach((p,i)=>{const v=c0.tienda[p.id]||{c:0,t:0};sc+=v.c;st+=v.t;
      rowL([ci+1+'.'+pad(i+1),p.nombre,Q2(p.precio),v.c||'',m$(v.t)],{fill:i%2===0?GR:'#fff'});});
    rowL(['','TOTAL','',sc||'',m$(st)],{bold:1,col:{1:{align:'right',bold:1}}});
  });
  const oi=TCATS.length+1;
  rowL([oi,'OTROS'],{bold:1,col:{1:{align:'left',bold:1}}});
  rowL([oi+'.1','Desperdicio','',c0.desperdicio||'',''],{fill:GR});
  cell(LX,yl,590,H,'TOTAL 1',{bold:1,align:'right'});cell(LX+590,yl,140,H,Q2(c0.tot1),{bold:1,align:'right'});yl+=H;
  /* derecha */
  const RX=790;let yr=30;
  cell(RX,yr,130,H,'FECHA:',{bold:1,align:'center'});cell(RX+130,yr,310,H,dmy(f));
  cell(RX+440,yr,80,H,'HORA:',{bold:1,align:'center'});cell(RX+520,yr,170,H,d.hora||(f===dia()?hora(Date.now()):''));yr+=H;
  cell(RX,yr,130,H,'RESPONSABLE:',{bold:1,align:'center',size:12});cell(RX+130,yr,560,H,d.resp);yr+=H+22;
  const sec=(title,items,min,total)=>{
    cell(RX,yr,690,H,title,{bold:1,align:'center'});yr+=H;
    const n=Math.max(min,items.length);
    for(let i=0;i<n;i++){const it=items[i]||{};cell(RX,yr,30,H,i+1,{align:'center'});cell(RX+30,yr,530,H,it.l||it.c||'');cell(RX+560,yr,130,H,m$(it.m),{align:'right'});yr+=H}
    cell(RX,yr,560,H,'TOTAL',{bold:1,align:'right'});cell(RX+560,yr,130,H,Q2(total),{bold:1,align:'right'});yr+=H+16;
  };
  sec('GASTOS',c0.gastos,4,c0.tg);
  sec('PEDIDOS YA',c0.py,5,c0.tpy);
  sec('TRANSFERENCIA',c0.tr,4,c0.ttr);
  sec('VENTA CON TARJETA DE CRÉDITO',c0.tj,3,c0.ttj);
  sec('TORTILLA AL CRÉDITO',c0.cr,3,c0.tcr);
  cell(RX,yr,690,H,'VENTA TOTAL DÍA',{bold:1,align:'center'});yr+=H;
  [['TOTAL 1',c0.tot1],['GASTOS',c0.tg],['PEDIDOS YA',c0.tpy],['TRANSFERENCIA',c0.ttr],['VENTA CON TARJETA DE CRÉDITO',c0.ttj],['TORTILLA AL CRÉDITO',c0.tcr]].forEach(([l,v],i)=>{
    cell(RX,yr,30,H,i+1,{align:'center'});cell(RX+30,yr,530,H,l,{bold:i===1||i===3});cell(RX+560,yr,130,H,m$(v),{align:'right'});yr+=H});
  cell(RX,yr,560,H,'TOTAL',{bold:1,align:'right'});cell(RX+560,yr,130,H,Q2(c0.ventaTotal),{bold:1,align:'right'});yr+=H+16;
  cell(RX,yr,690,H,'EFECTIVO EN CAJA',{bold:1,align:'center'});yr+=H;
  cell(RX,yr,30,H,1,{align:'center'});cell(RX+30,yr,530,H,'EFECTIVO FÍSICO + GASTOS');cell(RX+560,yr,130,H,d.ef==null?'':Q2(c0.efGastos),{align:'right'});yr+=H;
  cell(RX,yr,30,H,2,{align:'center'});cell(RX+30,yr,530,H,'TOTAL 1 + TORTILLA AL CRÉDITO',{bold:1});cell(RX+560,yr,130,H,Q2(c0.tot1+c0.tcr),{align:'right'});yr+=H;
  const falt=d.ef!=null&&c0.dif<-0.004?-c0.dif:0,sobr=d.ef!=null&&c0.dif>0.004?c0.dif:0;
  cell(RX,yr,30,H,3,{align:'center'});cell(RX+30,yr,110,H,'FALTANTE',{bold:1,size:13});cell(RX+140,yr,100,H,m$(falt),{align:'right',bold:1,fill:falt?'#e63946':null,color:falt?'#fff':null});
  cell(RX+240,yr,220,H,'SOBRANTE',{align:'center',fill:GR,size:13});cell(RX+460,yr,100,H,'');cell(RX+560,yr,130,H,m$(sobr),{align:'right',bold:1,fill:sobr?'#10b981':null});yr+=H+16;
  cell(RX,yr,690,H,'CONTROL DE PRODUCTO',{bold:1,align:'center'});yr+=H;
  d.control.forEach((k,i)=>{cell(RX,yr,30,H,i+1,{align:'center'});cell(RX+30,yr,400,H,(k.c||'').toUpperCase(),{size:13});cell(RX+430,yr,260,H,k.v||'',{align:'right'});yr+=H});
  /* recorte */
  const h=Math.max(yl,yr)+24;
  const out=document.createElement('canvas');out.width=W*SC;out.height=h*SC;
  out.getContext('2d').drawImage(big,0,0,W*SC,h*SC,0,0,W*SC,h*SC);
  return out;
}

/* ---------- Historial ---------- */
let fechaH=dia();
function vHist(){
  const ms=S.mov.filter(m=>dia(new Date(m.ts))===fechaH).sort((a,b)=>b.ts-a.ts);
  return `<h2>Historial</h2>
  <input type="date" id="fh" value="${fechaH}" max="${dia()}" aria-label="Fecha">
  <div class="panel" style="margin-top:14px">${ms.map(m=>{const p=prod(m.pid),cn=canalDe(m);return `<div class="fila"><div class="n"><b>${esc(p?p.nombre:'(borrado)')}</b><small>${hora(m.ts)}${m.nota?' · '+esc(m.nota):''}</small></div>${m.tipo==='venta'&&cn!=='tienda'?`<span class="tag ${CTAG[cn]}">${CANAL_LBL[cn]}</span>`:''}<span class="tag ${m.tipo}">${m.tipo}</span><div style="min-width:54px;text-align:right"><b>${m.tipo==='entrada'?'+':'−'}${m.cant}</b>${m.tipo==='venta'?`<br><small style="color:var(--mut)">${Q(m.cant*m.precio)}</small>`:''}</div><button class="del" data-d="${m.id}" aria-label="Eliminar registro">✕</button></div>`}).join('')||'<div class="vacio">Sin movimientos este día</div>'}</div>
  <h3>Descargar</h3>
  <div class="panel r"><button class="btn g" id="xls" style="border:3px solid #fff">Excel con todos los movimientos (.xlsx)</button>
  <p class="nota">Archivo de Excel de verdad, con columnas ordenadas. Los datos quedan guardados en la base de datos; esto es solo una copia para revisar.</p></div>`;
}
function bHist(){
  document.getElementById('fh').onchange=e=>{fechaH=e.target.value||dia();render()};
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este registro? El stock se ajustará.')){op({op:'delMov',id:b.dataset.d});render();aviso('Registro eliminado')}});
  document.getElementById('xls').onclick=()=>{
    if(!window.XLSX)return aviso('Necesita internet para generar el Excel',1);
    const filas=S.mov.slice().sort((a,b)=>a.ts-b.ts).map(m=>({Fecha:dmy(dia(new Date(m.ts))),Hora:hora(m.ts),Tipo:m.tipo,Canal:m.tipo==='venta'?CANAL_LBL[canalDe(m)]:'',Producto:prod(m.pid)?prod(m.pid).nombre:'',Cantidad:m.cant,Precio:m.precio||'',Total:m.tipo==='venta'?m.cant*m.precio:'',Nota:m.nota||''}));
    const ws=XLSX.utils.json_to_sheet(filas.length?filas:[{Fecha:'',Hora:'',Tipo:'',Canal:'',Producto:'',Cantidad:'',Precio:'',Total:'',Nota:''}]);
    ws['!cols']=[{wch:11},{wch:7},{wch:9},{wch:14},{wch:26},{wch:9},{wch:8},{wch:9},{wch:30}];
    const st=S.productos.filter(p=>!esCliente(p)).map(p=>({Producto:p.nombre,Categoría:p.cat,'Precio tienda':p.precio,'Precio Pedidos Ya':p.pp==null?'':p.pp,'Stock actual':stockDe(p.id)}));
    const ws2=XLSX.utils.json_to_sheet(st);ws2['!cols']=[{wch:26},{wch:11},{wch:13},{wch:17},{wch:12}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Movimientos');XLSX.utils.book_append_sheet(wb,ws2,'Stock actual');
    XLSX.writeFile(wb,'tortimex-inventario-'+dia()+'.xlsx');
  };
}

/* ---------- Productos ---------- */
function vProd(){
  return `<h2>Productos</h2>
  <div class="panel"><div class="edit"><span class="cab">Producto</span><span class="cab">Tienda Q</span><span class="cab">P. Ya Q</span><span></span></div>
  ${S.productos.map(p=>`<div class="edit"><input class="nm" value="${esc(p.nombre)}" maxlength="50" data-nm="${p.id}" aria-label="Nombre"><input type="number" step="0.25" min="0" value="${p.precio}" data-pr="${p.id}" aria-label="Precio">${esCliente(p)?'<span></span>':`<input type="number" step="0.5" min="0" value="${p.pp==null?'':p.pp}" placeholder="—" data-pp="${p.id}" aria-label="Precio Pedidos Ya">`}<button class="x" data-del="${p.id}" aria-label="Borrar producto">✕</button></div>`).join('')}
  <p class="nota">Toca un nombre o un precio para cambiarlo; se guarda solo y le llega a todos. “P. Ya” es el precio en Pedidos Ya; si lo dejas vacío se usa el de tienda. Solo se puede borrar un producto que no tenga movimientos.</p></div>
  <h3>Agregar producto</h3>
  <div class="panel r"><label for="np">Nombre</label><input id="np" maxlength="50">
   <div class="grid2"><div><label for="nc">Categoría</label><input id="nc" list="cl" value="Frituras"><datalist id="cl">${CATS.map(c=>`<option>${esc(c)}`).join('')}</datalist></div><div><label for="npr">Precio tienda Q</label><input id="npr" type="number" step="0.5" min="0"></div></div>
   <label for="npp">Precio Pedidos Ya Q (opcional)</label><input id="npp" type="number" step="0.5" min="0">
   <div style="margin-top:16px"><button class="btn" id="addp">Agregar</button></div></div>`;
}
function bProd(){
  const setP=()=>op({op:'setProductos',productos:S.productos});
  document.querySelectorAll('[data-nm]').forEach(i=>i.onchange=()=>{const p=prod(i.dataset.nm),n=i.value.trim();if(!n){i.value=p.nombre;return aviso('El nombre no puede quedar vacío',1)}p.nombre=n;setP();aviso('Nombre actualizado')});
  document.querySelectorAll('[data-pr]').forEach(i=>i.onchange=()=>{prod(i.dataset.pr).precio=Math.max(0,parseFloat(i.value)||0);setP();aviso('Precio actualizado')});
  document.querySelectorAll('[data-pp]').forEach(i=>i.onchange=()=>{prod(i.dataset.pp).pp=i.value===''?null:Math.max(0,parseFloat(i.value)||0);setP();aviso('Precio Pedidos Ya actualizado')});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const p=prod(b.dataset.del);
    if(S.mov.some(m=>m.pid===p.id))return aviso('No se puede borrar: ya tiene movimientos',1);
    if(!confirm('¿Borrar "'+p.nombre+'"?'))return;
    S.productos=S.productos.filter(x=>x.id!==p.id);setP();render();aviso('Producto borrado');
  });
  document.getElementById('addp').onclick=()=>{
    const n=document.getElementById('np').value.trim(),pr=parseFloat(document.getElementById('npr').value),pp=document.getElementById('npp').value;
    if(!n||isNaN(pr))return aviso('Falta nombre o precio',1);
    S.productos.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),nombre:n,cat:document.getElementById('nc').value.trim()||'Otros',precio:pr,pp:pp===''?null:parseFloat(pp),min:0});
    setP();render();aviso('Producto agregado');
  };
}
render();pintarEstado();sync();
setInterval(sync,15000);
addEventListener('online',sync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
</script>
